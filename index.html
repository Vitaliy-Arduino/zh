<!doctype html>
<html>
<head>
<title>Web Serial Terminal</title>
 
<script src="term.js"></script>
</head>
<body>

<div style="display:inline-block; vertical-align:top;">
<br>
<b>Web Serial</b>

<select name="speed" id="SerialSpeed">
  <option value="9600">9600</option>
  <option value="19200">19200</option>
  <option value="38400">38400</option>
  <option value="57600">57600</option>
  <option value="115200">115200</option>
  <option value="1200">1200</option>
  <option value="2400">2400</option>
  <option value="4800">4800</option>
</select>
<button id="SerialConnectButton" type="button" disabled>Connect</button>
  <input type="text" id="inputText" placeholder="Введите текст" style="width: 200px;">
<button id="sendButton" type="button" disabled>Отправить</button>
<br><br>
<div id="term" >
</div>

<!-- Добавляем форму ввода текста и кнопку отправки -->


</div>

</body>

<script>

var term;

function calculate_size(win) {
    var cols = Math.max(80, Math.min(150, (win.innerWidth - 280) / 7)) | 0;
    var rows = Math.max(24, Math.min(80, (win.innerHeight - 180) / 12)) | 0;
    return [cols, rows];
}

(function() {
    window.onload = function() {
    
      var size = calculate_size(self);
      term = new Terminal({
        cols: 120,
        rows: 50,
        useStyle: true,
        screenKeys: true,
        cursorBlink: false
      });
      term.open(document.getElementById("term"));
    };
    window.addEventListener('resize', function() {
        var size = calculate_size(self);
        term.resize(size[0], size[1]);
    });
}).call(this);

const connectButton = document.getElementById('SerialConnectButton');
const sendButton = document.getElementById('sendButton');
const inputText = document.getElementById('inputText');
let port;

if ('serial' in navigator) {
  connectButton.addEventListener('click', function () {
    if (port) {
      term.write('\x1b[31mDisconnected from Serial Port\x1b[m\r\n');
      port.close();
      port = undefined;
      connectButton.innerText = 'Connect';
      sendButton.disabled = true; // Отключаем кнопку отправки
      inputText.value = ''; // Очищаем поле ввода
    }
    else {
      connectButton.innerText = 'Disconnect';
      getReader();
    }
  });

  connectButton.disabled = false;
}
else {
  const error = document.createElement('p');
  error.innerHTML = '<p>Support for Serial Web API not enabled. Please enable it using chrome://flags/ and enable Experimental Web Platform fetures</p>';
}

let lineBuffer = '';
let latestValue = 0;

async function serialWrite(data) {
  const encoder = new TextEncoder();
  const dataArrayBuffer = encoder.encode(data);

  if (port && port.writable) {
    const writer = port.writable.getWriter();
    await writer.write(dataArrayBuffer);
    writer.releaseLock();
  }
}

async function getReader() {
  port = await navigator.serial.requestPort({});
  var e = document.getElementById("SerialSpeed");
  var strSpd = e.options[e.selectedIndex].value;

  var speed = parseInt(strSpd);
  await port.open({ baudRate: speed });

  document.getElementById('SerialSpeed').disabled = true;
  sendButton.disabled = false; // Включаем кнопку отправки

  connectButton.innerText = 'Disconnect';
  term.write('\x1b[31mConnected using Web Serial API !\x1b[m\r\n');

  const appendStream = new WritableStream({
    write(chunk) {
      term.write(chunk);
    }
  });

  port.readable
    .pipeThrough(new TextDecoderStream())
    .pipeTo(appendStream);

  term.on('data', function(data) {
    serialWrite(data);
  });
}

// Обработчик события для кнопки отправки
sendButton.addEventListener('click', function() {
  const textToSend = inputText.value;
  if (textToSend) {
    serialWrite(textToSend + '\r\n'); // Отправляем текст с переводом строки
    inputText.value = ''; // Очищаем поле ввода
  }
});

</script>

</html>
