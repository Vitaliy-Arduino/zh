  <div class="nav-wrap row">

<div class="row ending-words-wrap">

<div id="authModal" class="modal-overlay">
  <div class="modal-box">
    <span class="modal-close" onclick="closeAuthModal()">✕</span>

    <form id="authForm" onsubmit="return submitKey(event)">
      <div class="key-cells" id="keyCells">
        <input type="text" class="key-cell" maxlength="2" inputmode="text" autocomplete="off" spellcheck="false">
        <span class="key-dash">-</span>

        <span class="key-dash">-</span>
        <input type="text" class="key-cell" maxlength="2" inputmode="text" autocomplete="off" spellcheck="false">
        <span class="key-dash">-</span>
        <input type="text" class="key-cell" maxlength="2" inputmode="text" autocomplete="off" spellcheck="false">
        <span class="key-dash">-</span>
        <input type="text" class="key-cell" maxlength="2" inputmode="text" autocomplete="off" spellcheck="false">

      <div class="modal-actions">
        <button type="submit" class="btn btn-orange">登入网站</button>

<div id="buyModal" class="modal-overlay">
  <div class="modal-box modal-wide">
    <span class="modal-close" onclick="closeBuyModal()">✕</span>
    <img id="buyInstructionImg" src="../buy.png" alt="Инструкция по покупке ключа">
  </div>
</div>

<div id="videoModal" class="modal-overlay">
  <div class="modal-box modal-wide">
    <span class="modal-close" onclick="closeVideoModal()">✕</span>
    <div id="videoPlayerWrap"></div>
  </div>
</div>

<div id="schemeModal" class="modal-overlay">
  <div class="modal-box modal-wide">
    <span class="modal-close" onclick="closeSchemeModal()">✕</span>
    <img id="schemeImg" src="" alt="Схема">

<style>
/* ====== Модалки ====== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.65);
  display:none; align-items:center; justify-content:center;
  z-index:9999; padding:20px;
}
.modal-overlay.active{ display:flex; }
.modal-box{
  background:#fff; border-radius:12px; padding:24px;
  max-width:420px; width:100%; position:relative;
  box-shadow:0 10px 40px rgba(0,0,0,.4); color:#222;
}
.modal-box.modal-wide{ max-width:900px; padding:0; overflow:hidden; }
.modal-close{
  position:absolute; top:10px; right:14px; cursor:pointer;
  font-size:22px; color:#999; z-index:2; background:#fff;
  width:34px; height:34px; border-radius:50%; text-align:center; line-height:34px;
}
.modal-close:hover{ color:#000; }
#videoPlayerWrap video{ width:100%; max-height:70vh; display:block; background:#000; }
#schemeImg{ width:100%; display:block; max-height:70vh; object-fit:contain; background:#f4f4f4; }
#buyInstructionImg{ width:100%; display:block; max-height:80vh; object-fit:contain; background:#fff; }
.modal-box h3{ margin:0 0 14px; font:bold 20px arial; }
.modal-box input{
  width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;
  font:16px arial; box-sizing:border-box; margin-bottom:14px;
}
.modal-actions{ display:flex; gap:10px; margin-bottom:12px; }
.modal-actions .btn{ flex:1; }
.buy-key-link{ display:block; text-align:center; color:#ff6a00; font:14px arial; cursor:pointer; }
.auth-error{ color:#d00; font:14px arial; margin:0 0 10px; }
#authReason{ color:#ff6a00; font:14px arial; margin:0 0 10px; }

/* ====== Ячейки ввода ключа ====== */
.key-cells{
  display:flex; align-items:center; justify-content:center;
  gap:4px; margin-bottom:16px;
}
.key-cell{
  width:46px; height:48px; text-align:center;
  font:bold 18px arial; text-transform:lowercase;
  border:1px solid #ccc; border-radius:8px;
  box-sizing:border-box; outline:none;
  transition:border-color .15s, box-shadow .15s;
  margin-bottom:0 !important; padding:0 !important;
}
.key-cell:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 2px rgba(255,106,0,.25);
}
.key-dash{ font:bold 18px arial; color:#999; user-select:none; }
@media (max-width:480px){
  .key-cell{ width:40px; height:44px; font-size:16px; }
}

/* ====== Сетка карточек ====== */
#videoGrid{
  display:grid; grid-template-columns:repeat(6,1fr); gap:16px; padding:0 20px;
}
@media (max-width:1210px){ #videoGrid{ grid-template-columns:repeat(4,1fr);} }
@media (max-width:880px){ #videoGrid{ grid-template-columns:repeat(2,1fr);} }
@media (max-width:480px){ #videoGrid{ grid-template-columns:repeat(2,1fr); gap:10px; padding:0 12px; } }

.video-card{
  position:relative; background-size:cover; background-position:center;
  min-height:200px; cursor:pointer; border-radius:10px; overflow:hidden;
  transition:transform .25s ease; box-shadow:0 4px 14px rgba(0,0,0,.15);
}
.video-card:hover{ transform:scale(1.04); }
.video-card .feature-text{
  position:absolute; left:0; right:0; top:0; margin:0; padding:10px;
  color:#fff; font:bold 14px arial;
  background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);
}
.badge-free,.badge-premium{
  position:absolute; top:8px; right:8px; padding:3px 8px; border-radius:4px;
  font:bold 11px arial; color:#fff; z-index:2;
}
.badge-free{ background:#009c4c; }
.badge-premium{ background:#ff9800; }

.badge-check{
  position:absolute; top:8px; right:8px; z-index:2;
  width:26px; height:26px; border-radius:50%;
  background:#009c4c; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font:bold 15px arial; box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.badge-check::before{ content:"✓"; }

.card-actions{
  position:absolute; bottom:0; left:0; right:0;
  display:grid; grid-template-columns:repeat(3,1fr); gap:5px;
  padding:8px; background:rgba(0,0,0,.6);
}
.btn-mini{
  font:11px arial; padding:7px 3px; border:none; border-radius:6px;
  cursor:pointer; text-align:center; text-decoration:none; color:#222;
  background:#fff; transition:background .2s; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; justify-content:center;
}
.btn-mini:hover{ background:#ffd28a; text-decoration:none; }
a.btn-mini{ text-decoration:none; color:#222; }
@media (max-width:480px){
  .btn-mini{ font-size:9px; padding:6px 1px; }
  .card-actions{ grid-template-columns:repeat(3,1fr); gap:3px; padding:5px; }
}

/* ====== МОБИЛЬНОЕ МЕНЮ ====== */
.mobile-nav{ display:none; }
#mobileNav .nav-content-wrap{ display:none; padding:10px 0 0; }
#mobileNav.menu-open .nav-content-wrap{ display:block; }
#mobileNav .nav-control .close{ display:none; }
#mobileNav .nav-control .open{ display:inline-block; }
#mobileNav.menu-open .nav-control .close{ display:inline-block; }
#mobileNav.menu-open .nav-control .open{ display:none; }
@media (max-width:880px){
  .pc-nav{ display:none; }
  .mobile-nav{ display:block; }
}

/* ====== ВЫЕЗЖАЮЩАЯ ШАПКА ====== */
#siteHeader{ position:relative; width:100%; z-index:9997; }
#siteHeader.header-fixed{
  position:fixed; top:0; left:0; right:0;
  background:#021a32;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
  animation:headerSlideDown .28s ease;
}
@keyframes headerSlideDown{
  from{ transform:translateY(-100%); }
  to{ transform:translateY(0); }
}
body.header-spacer{ padding-top:64px; }
</style>

<script src="../js/index.js"></script>
<script>
/* =====================================================
   секретики
   ===================================================== */
var VALID_KEYS = [
  '98-16-26-27-67',
  '69-31-07-97-86',
  '94-45-39-28-64'
];
var STORAGE_KEY = 'ardublock_key';

function getStoredKey(){ try { return localStorage.getItem(STORAGE_KEY) || ''; } catch(e){ return ''; } }
function isValidKey(key){
  if (!key) return false;
  var k = String(key).trim().toLowerCase();
  for (var i = 0; i < VALID_KEYS.length; i++){
    if (VALID_KEYS[i].toLowerCase() === k) return true;
  }
  return false;
}
function isAuthed(){ return isValidKey(getStoredKey()); }
function saveKey(key){ try { localStorage.setItem(STORAGE_KEY, String(key).trim()); } catch(e){} }
function clearKey(){ try { localStorage.removeItem(STORAGE_KEY); } catch(e){} }

var IS_AUTHED = isAuthed();

function renderAuthUI(){
  var navItem = IS_AUTHED
    ? '<a href="#" class="link_underline" onclick="logout(event)">退出网站</a>'
    : '<a href="#" class="link_underline" onclick="openAuthModal(event)">登入网站</a>';
  var s1 = document.getElementById('navAuthSlot');
  var s2 = document.getElementById('navAuthSlotMobile');
  if (s1) s1.innerHTML = navItem;
  if (s2) s2.innerHTML = navItem;

  var grid = document.getElementById('videoGrid');
  if (grid){
    grid.innerHTML = '';
    currentPage = 0; isLoading = false; reachedEnd = false;
    loadMore();
  }
}
function logout(e){
  if (e) e.preventDefault();
  clearKey();
  IS_AUTHED = false;
  renderAuthUI();
}

/* =====================================================
   МОДАЛКА ВХОДА
   ===================================================== */
var keyCells = [];
function getKeyCells(){ return document.querySelectorAll('#keyCells .key-cell'); }
function collectKey(){
  var cells = getKeyCells();
  var parts = [];
  for (var i = 0; i < cells.length; i++) parts.push(cells[i].value.trim().toLowerCase());
  for (var j = 0; j < parts.length; j++) if (parts[j].length !== 2) return '';
  return parts.join('-');
}
function focusCell(idx){
  var cells = getKeyCells();
  if (idx < 0 || idx >= cells.length) return;
  cells[idx].focus(); cells[idx].select();
}
function resetCells(){
  var cells = getKeyCells();
  for (var i = 0; i < cells.length; i++) cells[i].value = '';
  focusCell(0);
}
function setupKeyCells(){
  var cells = getKeyCells();
  if (!cells.length) return;
  keyCells = Array.prototype.slice.call(cells);

  keyCells.forEach(function(cell, idx){
    cell.addEventListener('input', function(){
      var v = cell.value.replace(/[^a-z0-9]/gi, '').toLowerCase();
      if (v.length > 2) v = v.slice(0, 2);
      cell.value = v;
      if (v.length === 2){
        if (idx < keyCells.length - 1) focusCell(idx + 1);
        else { cell.blur(); submitKey(); }
      }
    });
    cell.addEventListener('keydown', function(e){
      if (e.key === 'Backspace' && cell.value.length === 0 && idx > 0){ e.preventDefault(); focusCell(idx - 1); }
      else if (e.key === 'ArrowLeft' && idx > 0){ e.preventDefault(); focusCell(idx - 1); }
      else if (e.key === 'ArrowRight' && idx < keyCells.length - 1){ e.preventDefault(); focusCell(idx + 1); }
      else if (e.key === 'Enter'){ e.preventDefault(); submitKey(); }
    });
    cell.addEventListener('focus', function(){ cell.select(); });
    cell.addEventListener('paste', function(e){
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text') || '';
      var clean = text.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (clean.length >= 10){
        var all = getKeyCells();
        for (var i = 0; i < 5; i++) all[i].value = clean.substr(i * 2, 2);
        if (collectKey()) submitKey(); else focusCell(4);
      } else {
        var v = clean.slice(0, 2);
        cell.value = v;
        if (v.length === 2 && idx < 4) focusCell(idx + 1);
      }
    });
  });
}

function openAuthModal(e, reason){
  if (e && e.preventDefault) e.preventDefault();
  var r = document.getElementById('authReason');
  if (r) r.style.display = reason ? 'block' : 'none';
  var err = document.getElementById('authError');
  if (err){ err.style.display = 'none'; err.textContent = ''; }
  document.getElementById('authModal').classList.add('active');
  setTimeout(function(){ resetCells(); focusCell(0); }, 100);
}
function closeAuthModal(){ document.getElementById('authModal').classList.remove('active'); }

function submitKey(e){
  if (e && e.preventDefault) e.preventDefault();
  var err = document.getElementById('authError');
  var key = collectKey();
  if (!key){ if (err){ err.textContent = '输入许可证密钥的所有5对字符'; err.style.display = 'block'; } return false; }
  if (!isValidKey(key)){ if (err){ err.textContent = '无效密钥'; err.style.display = 'block'; } return false; }
  saveKey(key);
  IS_AUTHED = true;
  resetCells();
  closeAuthModal();
  renderAuthUI();
  return false;
}

function openBuyModal(e){
  if (e && e.preventDefault) e.preventDefault();
  closeAuthModal();
  document.getElementById('buyModal').classList.add('active');
}
function closeBuyModal(){ document.getElementById('buyModal').classList.remove('active'); }

/* =====================================================
   ВИДЕО / СХЕМА
   ===================================================== */
function openVideoModal(videoSrc, isPremium){
  if (isPremium && !IS_AUTHED){ openAuthModal(null, true); return; }
  document.getElementById('videoPlayerWrap').innerHTML =
    '<video src="' + videoSrc + '" controls autoplay playsinline ' +
    'style="width:100%;max-height:70vh;display:block;background:#000;">' +
    'Ваш браузер не поддерживает видео.' +
    '</video>';
  document.getElementById('videoModal').classList.add('active');
}
function closeVideoModal(){
  var wrap = document.getElementById('videoPlayerWrap');
  var vid = wrap.querySelector('video');
  if (vid) { vid.pause(); vid.src = ''; }
  document.getElementById('videoModal').classList.remove('active');
  wrap.innerHTML = '';
}
function openSchemeModal(schemeSrc){
  document.getElementById('schemeImg').src = schemeSrc;
  document.getElementById('schemeModal').classList.add('active');
}
function closeSchemeModal(){ document.getElementById('schemeModal').classList.remove('active'); }

/* =====================================================
   МОБИЛЬНОЕ МЕНЮ
   ===================================================== */
(function(){
  var nav = document.getElementById('mobileNav');
  if (!nav) return;
  var openBtn  = document.getElementById('menuOpen');
  var closeBtn = document.getElementById('menuClose');
  var content  = document.getElementById('mobileNavContent');
  function openMenu(){ nav.classList.add('menu-open'); }
  function closeMenu(){ nav.classList.remove('menu-open'); }
  if (openBtn)  openBtn.addEventListener('click',  function(e){ e.preventDefault(); openMenu();  });
  if (closeBtn) closeBtn.addEventListener('click', function(e){ e.preventDefault(); closeMenu(); });
  if (content){
    content.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){ setTimeout(closeMenu, 50); });
    });
  }
})();

/* =====================================================
   ВЫЕЗЖАЮЩАЯ ШАПКА ПРИ ПРОКРУТКЕ
   ===================================================== */
(function(){
  var header = document.getElementById('siteHeader');
  if (!header) return;
  var headerH = header.offsetHeight || 64;
  function onScroll(){
    var y = window.scrollY || window.pageYOffset;
    if (y > headerH){
      if (!header.classList.contains('header-fixed')){
        header.classList.add('header-fixed');
        document.body.classList.add('header-spacer');
      }
    } else {
      if (header.classList.contains('header-fixed')){
        header.classList.remove('header-fixed');
        document.body.classList.remove('header-spacer');
      }
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();

/* =====================================================
   ЗАКРЫТИЕ МОДАЛОК
   ===================================================== */
document.querySelectorAll('.modal-overlay').forEach(function(m){
  m.addEventListener('click', function(e){ if (e.target === m) m.classList.remove('active'); });
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    document.querySelectorAll('.modal-overlay.active').forEach(function(m){ m.classList.remove('active'); });
    closeVideoModal();
  }
});

/* =====================================================
   СПИСОК УРОКОВ
   ===================================================== */
var ALL_VIDEOS = [
  { title:'安装程序', thumb:'./001.jpg', video:'./001.mp4', file:'https://s.taobao.com/search?q=led 5mm', online:'../app/?url=../lessons/001.ardublock', scheme:'./001.png', premium:false },

//  { title:'Кнопка и светодиод', thumb:'../img/thumbs/002.jpg', video:'../video/002.mp4', file:'../files/002.ardublock', online:'../online/002/', scheme:'../schemes/002.png', premium:true },

];

function renderCard(v){
  var div = document.createElement('div');
  div.className = 'video-card';
  div.style.backgroundImage = 'url(' + v.thumb + ')';

  var badgeHTML = IS_AUTHED
    ? '<span class="badge-check"></span>'
    : '<span class="' + (v.premium ? 'badge-premium' : 'badge-free') + '">' +
        (v.premium ? '高级' : '免费') + '</span>';

  div.innerHTML =
    badgeHTML +
    '<p class="feature-text">' + v.title + '</p>' +
    '<div class="card-actions">' +
      '<button class="btn-mini btn-scheme">接线图</button>' +
      '<a href="' + v.online + '" class="btn-mini btn-online" target="_blank" rel="noopener">在线打开</a>' +
      '<button class="btn-mini btn-download-mini">淘宝网</button>' +
    '</div>';

  div.addEventListener('click', function(){ openVideoModal(v.video, v.premium); });

  div.querySelector('.btn-online').addEventListener('click', function(e){
    e.stopPropagation();
    if (v.premium && !IS_AUTHED){ e.preventDefault(); openAuthModal(null, true); }
  });

  div.querySelector('.btn-download-mini').addEventListener('click', function(e){
    e.stopPropagation();
    if (v.premium && !IS_AUTHED){ openAuthModal(null, true); return; }
    var a = document.createElement('a');
    a.href = v.file;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  div.querySelector('.btn-scheme').addEventListener('click', function(e){
    e.stopPropagation();
    openSchemeModal(v.scheme);
  });

  return div;
}

var currentPage = 0;
var isLoading = false;
var reachedEnd = false;
var PAGE_SIZE = 6;

function loadMore(){
  if (isLoading || reachedEnd) return;
  isLoading = true;
  document.getElementById('videoLoader').style.display = 'block';

  var start = currentPage * PAGE_SIZE;
  var items = ALL_VIDEOS.slice(start, start + PAGE_SIZE);
  var grid = document.getElementById('videoGrid');
  items.forEach(function(v){ grid.appendChild(renderCard(v)); });

  currentPage++;
  if (start + PAGE_SIZE >= ALL_VIDEOS.length) reachedEnd = true;

  document.getElementById('videoLoader').style.display = 'none';
  isLoading = false;
}

(function init(){
  setupKeyCells();
  renderAuthUI();

  var sentinel = document.getElementById('loadMoreSentinel');
  if ('IntersectionObserver' in window && sentinel){
    var io = new IntersectionObserver(function(entries){
      if (entries[0].isIntersecting) loadMore();
    }, { rootMargin: '300px' });
    io.observe(sentinel);
  } else {
    window.addEventListener('scroll', function(){
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) loadMore();
    });
  }
  loadMore();
})();
</script>
</body>
</html>
